[project]
name = "arango-connector-core"
version = "0.1.0"
description = "Shared source logic for the Arango Universal Connector: models, source clients, normalization, text extraction."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "google-auth-oauthlib>=1.5.0",
    "requests>=2.31",
    "slack-sdk>=3.27",
    "tzdata>=2024.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[project.scripts]
arango-connector-gmail-auth = "arango_connector.sources.gmail.auth:auth_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_connector"]
