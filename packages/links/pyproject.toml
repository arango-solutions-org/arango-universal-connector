[project]
name = "arango-connector-links"
version = "0.1.0"
description = "Arango Universal Connector sources as ArangoDB Platform Links (on-demand jobs, JSONL results)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "arango-connector-core",
    "grpcio>=1.66",
    "protobuf>=5.28",
    "googleapis-common-protos>=1.65",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
arango-connector-link = "arango_connector_links.main:main"

[tool.uv.sources]
arango-connector-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_connector_links"]
