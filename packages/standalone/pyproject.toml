[project]
name = "arango-connector"
version = "0.1.0"
description = "Standalone Arango Universal Connector: runs a source continuously and writes it to ArangoDB."
requires-python = ">=3.12,<3.13"
dependencies = [
    "arango-connector-core",
    "slack-bolt>=1.18",
    "python-arango>=8.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "requests>=2.31",
]

[project.scripts]
arango-connector = "arango_connector_standalone.main:main"
arango-connector-reconcile-expiry = "arango_connector_standalone.maintenance:main"

[tool.uv.sources]
arango-connector-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_connector_standalone"]
