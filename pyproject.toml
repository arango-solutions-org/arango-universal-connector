[project]
name = "arango-universal-connector"
version = "0.1.0"
description = "Workspace root for the Arango Universal Connector packages (not published)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["arango-connector-core", "arango-connector", "arango-connector-links"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arango-connector-core = { workspace = true }
arango-connector = { workspace = true }
arango-connector-links = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "grpcio-tools>=1.66",
    "types-protobuf>=5.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require a running ArangoDB (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core/src", "packages/standalone/src", "packages/links/src", "tools", "tests"]
extend-exclude = ["packages/links/src/arango_connector_links/_pb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/core/src", "packages/standalone/src", "packages/links/src", "tools"]
packages = ["arango_connector", "arango_connector_standalone", "arango_connector_links"]
modules = ["doctools"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "arango_connector_links._pb.*"
ignore_errors = true
