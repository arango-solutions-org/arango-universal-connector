[project]
name = "arango-connector"
version = "0.1.0"
description = "Universal connector feeding sources (Slack, Gmail, ...) into ArangoDB."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "slack-bolt>=1.18",
    "python-arango>=8.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "google-auth-oauthlib>=1.5.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[project.scripts]
arango-connector = "arango_connector.main:main"
arango-connector-reconcile-expiry = "arango_connector.maintenance:main"
arango-connector-gmail-auth = "arango_connector.sources.gmail.auth:auth_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require a running ArangoDB (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["arango_connector"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
