[project]
name = "arango-connector"
version = "0.1.0"
description = "Universal connector feeding messages from sources (Slack, ...) into ArangoDB."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "slack-bolt>=1.18",
    "python-arango>=8.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
]

[project.scripts]
arango-connector = "arango_connector.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require a running ArangoDB (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["arango_connector"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
