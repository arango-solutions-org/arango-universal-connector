# What every connector service shares; each service adds its profile and environment.
x-connector: &connector
  build:
    context: .
    dockerfile: packages/standalone/Dockerfile
  env_file: .env
  depends_on:
    arangodb:
      condition: service_healthy
  volumes:
    - connector_data:/data
  restart: unless-stopped

services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:?set ARANGO_PASSWORD in .env}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8529/_admin/server/availability || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Each source has its own profile, so SOURCE in .env (used by local runs) can never
  # start a second process on the same cursor. Start it with: docker compose --profile slack up -d
  connector:
    <<: *connector
    profiles: ["slack"]
    environment:
      SOURCE: slack
      ARANGO_HOSTS: http://arangodb:8529

  # Gmail runs as its own connector process (one source per process), writing to its own
  # collection. Start it with: docker compose --profile gmail up -d
  connector-gmail:
    <<: *connector
    profiles: ["gmail"]
    environment:
      SOURCE: gmail
      ARANGO_HOSTS: http://arangodb:8529
      ARANGO_COLLECTION: ${GMAIL_ARANGO_COLLECTION:-emails}
      DEAD_LETTER_PATH: /data/gmail_dead_letter.jsonl
      # Paths inside the container; put the files in ./secrets/gmail on the host.
      GMAIL_SERVICE_ACCOUNT_FILE: /secrets/gmail/service-account.json
      GMAIL_OAUTH_TOKEN_DIR: /secrets/gmail
    volumes: # replaces the shared list, so it repeats /data
      - connector_data:/data
      - ./secrets/gmail:/secrets/gmail:ro

  # Jira runs as its own connector process, writing to its own collection. Retention is
  # off by default: it counts from created_at, and an old issue updated today would be
  # stored already expired. Start it with: docker compose --profile jira up -d
  connector-jira:
    <<: *connector
    profiles: ["jira"]
    environment:
      SOURCE: jira
      ARANGO_HOSTS: http://arangodb:8529
      ARANGO_COLLECTION: ${JIRA_ARANGO_COLLECTION:-jira}
      RETENTION_DAYS: ${JIRA_RETENTION_DAYS:-0}
      DEAD_LETTER_PATH: /data/jira_dead_letter.jsonl

volumes:
  arangodb_data:
  arangodb_apps:
  connector_data:
